<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>RENDERER2 continuous composition seek fixture</title>
  <script>
    const BOUNDS = [0, 0.2];
    const duration = 0.4;
  </script>
</head>
<body style="margin:0;background:#000">
  <div
    id="om-none"
    class="stage"
    data-cde-stage
    data-screen-label="OM seek fixture"
    data-om-exportable-video-with-duration-secs="0.4"
    data-om-sync-seek="true"
    style="width:320px;height:320px;background:#111;color:#fff;font:32px sans-serif"
  >om-none</div>
  <script>
    const stage = document.querySelector('.stage');
    stage.addEventListener('data-om-seek-to-time-frame', (event) => {
      const time = Number(event.detail && event.detail.time);
      const label = 'om-' + (Number.isFinite(time) ? time : 0).toFixed(3);
      stage.id = label;
      stage.textContent = label;
      stage.style.background = time >= 0.2 ? '#1657d8' : '#c52e2e';
    });
  </script>
</body>
</html>
