<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RENDERER2 heavy WebGL smoke fixture</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050914; }
    body { display: grid; place-items: center; }
    .stage { position: relative; width: 320px; height: 320px; overflow: hidden; }
    canvas { display: block; width: 320px; height: 320px; }
    input { position: fixed; opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <main class="stage" data-cde-stage="1" data-duration="1" data-render-mode="vt">
    <canvas width="320" height="320"></canvas>
  </main>
  <input type="range" min="0" max="1" step="0.001" value="0">
  <script>
    const BOUNDS = [0];
    const duration = 1;
    const canvas = document.querySelector('canvas');
    const slider = document.querySelector('input');
    const gl = canvas.getContext('webgl', { preserveDrawingBuffer: true });
    function draw() {
      const t = Number(slider.value || 0);
      gl.clearColor(0.08 + t * 0.6, 0.25, 0.65 - t * 0.4, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
    }
    slider.addEventListener('input', draw);
    function tick() { draw(); requestAnimationFrame(tick); }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
